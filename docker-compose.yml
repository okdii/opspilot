services:

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: opspilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opspilot}
      POSTGRES_USER: ${POSTGRES_USER:-opspilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opspilot} -d ${POSTGRES_DB:-opspilot}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  migrate:
    image: ghcr.io/okdii/opspilot-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: alembic upgrade head
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-opspilot}
      POSTGRES_USER: ${POSTGRES_USER:-opspilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      OPSPILOT_WRITER_PASSWORD: ${OPSPILOT_WRITER_PASSWORD}
      OPSPILOT_JWT_SECRET: ${OPSPILOT_JWT_SECRET}
      OPSPILOT_ENCRYPTION_KEY: ${OPSPILOT_ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  backend:
    image: ghcr.io/okdii/opspilot-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opspilot-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-opspilot}
      POSTGRES_USER: ${POSTGRES_USER:-opspilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      OPSPILOT_WRITER_PASSWORD: ${OPSPILOT_WRITER_PASSWORD}
      OPSPILOT_JWT_SECRET: ${OPSPILOT_JWT_SECRET}
      OPSPILOT_ENCRYPTION_KEY: ${OPSPILOT_ENCRYPTION_KEY}
      OPSPILOT_BASE_URL: ${OPSPILOT_BASE_URL:-}
      DEBUG: ${DEBUG:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  frontend:
    image: ghcr.io/okdii/opspilot-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opspilot-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8766:80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: opspilot-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

